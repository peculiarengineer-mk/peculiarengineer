<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
  <defs><radialGradient id="g" cx="30%" cy="32%" r="82%"><stop offset="0%" stop-color="#0f1a14"/><stop offset="100%" stop-color="#070c09"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#15251b" stroke-width="1"/></pattern></defs>
  <rect width="1360" height="680" fill="url(#g)"/><rect width="1360" height="680" fill="url(#grid)" opacity="0.5"/>
  <g><rect x="903.6" y="48" width="408.4" height="46" rx="8" fill="none" stroke="#8fa896" stroke-width="1.5"/>
  <text x="927.6" y="77" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" letter-spacing="2" fill="#5fd08a">&#9670; NGINX 1.28 · UBUNTU 26.04</text></g>
  <g><rect x="72" y="120" width="700" height="462" rx="11" fill="#090e0b" stroke="#8fa896" stroke-width="1.5"/>
  <line x1="72" y1="178" x2="772" y2="178" stroke="#15251b" stroke-width="1.5"/>
  <circle cx="104" cy="149" r="7" fill="#8fa896"/><circle cx="128" cy="149" r="7" fill="#8fa896"/><circle cx="152" cy="149" r="7" fill="#8fa896"/>
  <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#8fa896">reverse proxy, no docker</text>
  <text x="104" y="216" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#5fd08a"><tspan fill="#a9f0c2">$</tspan> curl -s http://app.example.com/</text>
  <text x="104" y="246" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#5fd08a">Host: app.example.com</text>
  <text x="104" y="276" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#5fd08a">X-Forwarded-For: 203.0.113.7</text>
  <text x="104" y="306" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#5fd08a">X-Forwarded-Proto: https</text>
  <text x="104" y="336" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#5fd08a"><tspan fill="#a9f0c2">$</tspan> sudo nginx -t</text>
  <text x="104" y="366" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#f0c060">[warn] the "listen ... http2" directive is deprecated</text>
  <text x="104" y="396" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#5fd08a"><tspan fill="#a9f0c2">$</tspan> systemctl stop app; curl -sI http://app.example.com/</text>
  <text x="104" y="426" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#f2837a">HTTP/1.1 502 Bad Gateway</text>
  <text x="104" y="456" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#f2837a">connect() failed (111: Connection refused)</text>
  <text x="104" y="548" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#8fa896">the app still only listens on loopback.<tspan fill="#5fd08a">&#9608;</tspan></text></g>
  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace">
  <text x="852" y="200" font-size="20" letter-spacing="2" fill="#8fa896">ONE HOSTNAME, ONE APP</text>
  <rect x="852" y="250" width="130" height="78" rx="9" fill="none" stroke="#8fa896" stroke-width="1.5"/>
  <text x="917" y="283" text-anchor="middle" font-size="17" fill="#a9f0c2">internet</text>
  <text x="917" y="308" text-anchor="middle" font-size="12" fill="#8fa896">:443 / :80</text>
  <rect x="1010" y="250" width="130" height="78" rx="9" fill="none" stroke="#5fd08a" stroke-width="2"/>
  <text x="1075" y="283" text-anchor="middle" font-size="17" fill="#5fd08a">nginx</text>
  <text x="1075" y="308" text-anchor="middle" font-size="12" fill="#8fa896">server_name</text>
  <rect x="1168" y="250" width="130" height="78" rx="9" fill="none" stroke="#8fa896" stroke-width="1.5"/>
  <text x="1233" y="283" text-anchor="middle" font-size="17" fill="#a9f0c2">app</text>
  <text x="1233" y="308" text-anchor="middle" font-size="12" fill="#8fa896">127.0.0.1:8080</text>
  <path d="M982 289 h22 m-6 -6 l6 6 l-6 6" fill="none" stroke="#5fd08a" stroke-width="2"/>
  <path d="M1140 289 h22 m-6 -6 l6 6 l-6 6" fill="none" stroke="#5fd08a" stroke-width="2"/>
  <text x="852" y="392" font-size="14" fill="#8fa896">proxy_set_header Host            <tspan fill="#5fd08a">$host</tspan></text>
  <text x="852" y="420" font-size="14" fill="#8fa896">proxy_set_header X-Forwarded-For <tspan fill="#5fd08a">$proxy_add_x_forw...</tspan></text>
  <text x="852" y="448" font-size="14" fill="#8fa896">proxy_set_header Upgrade         <tspan fill="#5fd08a">$http_upgrade</tspan></text>
  <text x="852" y="476" font-size="14" fill="#8fa896">client_max_body_size             <tspan fill="#f0c060">1m by default</tspan></text>
  <text x="852" y="504" font-size="14" fill="#8fa896">listen 443 ssl; <tspan fill="#5fd08a">http2 on;</tspan>   <tspan fill="#f2837a">not listen ... http2</tspan></text>
  <text x="852" y="556" font-size="13" fill="#a9f0c2">certbot 4.0 from apt. no snap on 26.04.</text></g>
</svg>