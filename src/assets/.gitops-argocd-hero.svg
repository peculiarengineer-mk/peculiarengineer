<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
  <defs>
    <radialGradient id="glow" cx="30%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#11151d"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#12161f" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1360" height="680" fill="url(#glow)"/>
  <rect width="1360" height="680" fill="url(#grid)" opacity="0.5"/>

  <!-- big ghost reconcile loop, bottom-right -->
  <g opacity="0.5" stroke="#182236" stroke-width="9" fill="none" stroke-linecap="round">
    <path d="M1128 612 A40 40 0 0 1 1208 612"/>
    <polyline points="1194 598 1208 613 1222 598"/>
    <path d="M1208 612 A40 40 0 0 1 1128 612"/>
    <polyline points="1142 626 1128 611 1114 626"/>
  </g>

  <!-- badge top-right -->
  <g>
    <rect x="1080" y="48" width="232" height="46" rx="8" fill="none" stroke="#3d5273" stroke-width="1.5"/>
    <text x="1106" y="77" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" letter-spacing="2" fill="#f0883e">&#9670; K3S &#183; GITOPS</text>
  </g>

  <!-- terminal window -->
  <g>
    <rect x="72" y="120" width="672" height="462" rx="11" fill="#0e121a" stroke="#3d5273" stroke-width="1.5"/>
    <line x1="72" y1="178" x2="744" y2="178" stroke="#12161f" stroke-width="1.5"/>
    <circle cx="104" cy="149" r="7" fill="#3d5273"/>
    <circle cx="128" cy="149" r="7" fill="#3d5273"/>
    <circle cx="152" cy="149" r="7" fill="#3d5273"/>
    <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#3d5273">homelab01 &#183; git drives the cluster</text>

    <text x="104" y="220" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#f0883e"><tspan fill="#ffb37a">$</tspan> kubectl scale deploy hello --replicas=5</text>
    <text x="104" y="248" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#6fd08a"><tspan fill="#6fd08a">&#10003;</tspan> deployment.apps/hello scaled</text>

    <text x="104" y="310" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#f0883e"><tspan fill="#ffb37a">$</tspan> kubectl get deploy hello -w</text>
    <text x="104" y="336" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#ffb37a">  hello   5/5   <tspan fill="#e5534b">OutOfSync</tspan></text>
    <text x="104" y="362" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#ffb37a">  hello   2/2   <tspan fill="#6fd08a">Synced</tspan>  <tspan fill="#3d5273">&#8592; 12s later</tspan></text>

    <text x="104" y="424" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#f0883e"><tspan fill="#ffb37a">$</tspan> git revert --no-edit HEAD &amp;&amp; git push</text>
    <text x="104" y="450" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#6fd08a"><tspan fill="#6fd08a">&#10003;</tspan> rolled back, no kubectl involved</text>

    <text x="104" y="510" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" fill="#3d5273">you stop applying YAML at a cluster.</text>
    <text x="104" y="538" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" fill="#3d5273">you push a commit and walk away.</text>
  </g>

  <!-- right column: the loop -->
  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace">
    <text x="852" y="196" font-size="20" letter-spacing="2" fill="#3d5273">THE LOOP</text>

    <rect x="852" y="216" width="456" height="58" rx="8" fill="none" stroke="#3d5273" stroke-width="2"/>
    <text x="876" y="252" font-size="19" fill="#ffb37a"><tspan fill="#3d5273">git repo</tspan>  &#183;  the declared state</text>

    <text x="1080" y="302" font-size="22" fill="#3d5273" text-anchor="middle">&#8595;</text>

    <rect x="852" y="316" width="456" height="82" rx="8" fill="none" stroke="#4d8bf0" stroke-width="2"/>
    <text x="876" y="350" font-size="18" fill="#ffb37a"><tspan fill="#4d8bf0">Argo CD</tspan> &#8594; watches the repo, syncs</text>
    <text x="876" y="380" font-size="18" fill="#ffb37a"><tspan fill="#4d8bf0">selfHeal</tspan> &#8594; undoes your hand edits</text>

    <text x="1080" y="428" font-size="22" fill="#3d5273" text-anchor="middle">&#8595;</text>

    <rect x="852" y="442" width="456" height="58" rx="8" fill="none" stroke="#6fd08a" stroke-width="2"/>
    <text x="876" y="478" font-size="19" fill="#6fd08a"><tspan fill="#6fd08a">&#10003;</tspan> cluster &#183; the observed state</text>

    <text x="852" y="548" font-size="18" fill="#3d5273">Synced means matches Git, not works</text>
  </g>
</svg>