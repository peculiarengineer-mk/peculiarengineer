<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
  <defs>
    <radialGradient id="glow" cx="30%" cy="32%" r="82%">
      <stop offset="0%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#251e18" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1360" height="680" fill="url(#glow)"/>
  <rect width="1360" height="680" fill="url(#grid)" opacity="0.5"/>

  <!-- ghost gear/shield bottom right -->
  <g opacity="0.5" stroke="#3a2f24" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1150 552 l40 -14 l40 14 v40 q0 34 -40 52 q-40 -18 -40 -52 z"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="936" y="48" width="376" height="46" rx="8" fill="none" stroke="#9a8a76" stroke-width="1.5"/>
    <text x="960" y="77" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" letter-spacing="2" fill="#e8a33d">&#9670; UBUNTU 26.04 &#183; SUDO-RS</text>
  </g>

  <!-- terminal -->
  <g>
    <rect x="72" y="120" width="672" height="462" rx="11" fill="#0e0b09" stroke="#9a8a76" stroke-width="1.5"/>
    <line x1="72" y1="178" x2="744" y2="178" stroke="#251e18" stroke-width="1.5"/>
    <circle cx="104" cy="149" r="7" fill="#9a8a76"/>
    <circle cx="128" cy="149" r="7" fill="#9a8a76"/>
    <circle cx="152" cy="149" r="7" fill="#9a8a76"/>
    <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#9a8a76">the sudo you know, rewritten</text>

    <text x="104" y="216" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> readlink -f /usr/bin/sudo</text>
    <text x="104" y="240" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#d9743f">/usr/lib/cargo/bin/sudo</text>

    <text x="104" y="292" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> sudo id</text>
    <text x="104" y="316" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#9a8a76">[sudo: authenticate] Password:</text>

    <text x="104" y="366" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> sudo -u bob whoami</text>
    <text x="104" y="390" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="13" fill="#f2837a">sudo: I'm sorry bob.</text>
    <text x="104" y="410" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="13" fill="#f2837a">I'm afraid I can't do that</text>

    <text x="104" y="462" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#9a8a76"># Defaults logfile=... </text>
    <text x="104" y="486" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="13" fill="#f2837a">unknown setting: 'logfile'</text>

    <text x="104" y="538" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#9a8a76">reads /etc/sudoers. drops a few lines.<tspan fill="#e8a33d">&#9608;</tspan></text>
  </g>

  <!-- right column -->
  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace">
    <text x="852" y="196" font-size="20" letter-spacing="2" fill="#9a8a76">SILENTLY DROPPED</text>
    <rect x="852" y="216" width="456" height="86" rx="8" fill="none" stroke="#f2837a" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="876" y="248" font-size="14" fill="#f5c56b">logfile &#183; requiretty &#183; !authenticate</text>
    <text x="876" y="274" font-size="14" fill="#9a8a76">digests &#183; log_output &#183; full -E</text>

    <text x="852" y="346" font-size="20" letter-spacing="2" fill="#9a8a76">STILL WORKS</text>
    <rect x="852" y="366" width="456" height="86" rx="8" fill="none" stroke="#4fbf87" stroke-width="2"/>
    <text x="876" y="398" font-size="14" fill="#4fbf87">NOPASSWD &#183; env_keep &#183; :user @host</text>
    <text x="876" y="424" font-size="14" fill="#9a8a76">the per-scope Defaults all resolve</text>

    <text x="852" y="496" font-size="20" letter-spacing="2" fill="#9a8a76">THE ESCAPE HATCH</text>
    <rect x="852" y="516" width="456" height="70" rx="8" fill="none" stroke="#9a8a76" stroke-width="2"/>
    <text x="876" y="548" font-size="13" fill="#f5c56b">update-alternatives --set sudo</text>
    <text x="876" y="570" font-size="13" fill="#9a8a76">/usr/bin/sudo.ws  &#8594; GNU sudo back</text>
  </g>
</svg>