<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
  <defs>
    <radialGradient id="glow" cx="28%" cy="32%" r="82%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#141d2e" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1360" height="680" fill="url(#glow)"/>
  <rect width="1360" height="680" fill="url(#grid)" opacity="0.5"/>

  <!-- ghost key, bottom right -->
  <g opacity="0.5" stroke="#1e2b45" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1150" cy="600" r="26"/>
    <path d="M1172 614 L1262 664 M1232 648 L1222 666 M1250 658 L1240 676"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="980" y="48" width="332" height="46" rx="8" fill="none" stroke="#7387a6" stroke-width="1.5"/>
    <text x="1004" y="77" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" letter-spacing="2" fill="#5aa9e6">&#9670; PART FIVE &#183; SEALED</text>
  </g>

  <!-- terminal -->
  <g>
    <rect x="72" y="120" width="672" height="462" rx="11" fill="#080c15" stroke="#7387a6" stroke-width="1.5"/>
    <line x1="72" y1="178" x2="744" y2="178" stroke="#141d2e" stroke-width="1.5"/>
    <circle cx="104" cy="149" r="7" fill="#7387a6"/>
    <circle cx="128" cy="149" r="7" fill="#7387a6"/>
    <circle cx="152" cy="149" r="7" fill="#7387a6"/>
    <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#7387a6">secrets in a public repo</text>

    <text x="104" y="218" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#5aa9e6"><tspan fill="#8fd0f5">$</tspan> git show apps/hello/hello-db.sealed.yaml</text>
    <text x="104" y="246" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#7387a6">kind: <tspan fill="#8fd0f5">SealedSecret</tspan></text>
    <text x="104" y="270" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#7387a6">  password: <tspan fill="#4fbf87">AgDbPa8GSoLADay0GI27Kd2ck...</tspan></text>

    <text x="104" y="322" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#5aa9e6"><tspan fill="#8fd0f5">$</tspan> k3s-uninstall.sh &amp;&amp; reinstall &amp;&amp; kubectl apply -f root.yaml</text>
    <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14">
      <text x="104" y="354" fill="#7387a6">NAME</text><text x="300" y="354" fill="#7387a6">SYNC</text><text x="470" y="354" fill="#7387a6">HEALTH</text>
      <text x="104" y="380" fill="#8fd0f5">hello</text><text x="300" y="380" fill="#4fbf87">Synced</text><text x="470" y="380" fill="#f2837a">Degraded</text>
      <text x="104" y="404" fill="#8fd0f5">root</text><text x="300" y="404" fill="#4fbf87">Synced</text><text x="470" y="404" fill="#4fbf87">Healthy</text>
    </g>
    <text x="104" y="436" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#f2837a">no key could decrypt secret (password)</text>
    <text x="104" y="460" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#f2837a">hello-7bb887b46b-8zfvz  CreateContainerConfigError<tspan fill="#5aa9e6">&#9608;</tspan></text>

    <text x="104" y="518" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#7387a6">synced means "matches git".</text>
    <text x="104" y="546" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#7387a6">it has never meant "works".</text>
  </g>

  <!-- right column -->
  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace">
    <text x="852" y="196" font-size="20" letter-spacing="2" fill="#7387a6">ONE KEY, ONE FILE</text>
    <rect x="852" y="216" width="456" height="80" rx="8" fill="none" stroke="#e6c15a" stroke-width="2"/>
    <text x="876" y="248" font-size="14" fill="#e6c15a">kubectl get secret -n kube-system -l ...</text>
    <text x="876" y="274" font-size="14" fill="#7387a6">7 KB. back it up before you seal anything.</text>

    <text x="852" y="340" font-size="20" letter-spacing="2" fill="#7387a6">THE RESTORE</text>
    <rect x="852" y="360" width="456" height="86" rx="8" fill="none" stroke="#4fbf87" stroke-width="2"/>
    <text x="876" y="392" font-size="14" fill="#4fbf87">registered private key  x2</text>
    <text x="876" y="416" font-size="14" fill="#7387a6">31 seconds. same pods. nothing recreated.</text>

    <text x="852" y="490" font-size="20" letter-spacing="2" fill="#7387a6">ROTATE IN THIS ORDER</text>
    <rect x="852" y="510" width="456" height="86" rx="8" fill="none" stroke="#f2837a" stroke-width="2"/>
    <text x="876" y="542" font-size="14" fill="#8fd0f5">re-encrypt, commit, then compromised</text>
    <text x="876" y="566" font-size="14" fill="#f2837a">the other way round breaks every secret</text>
  </g>
</svg>