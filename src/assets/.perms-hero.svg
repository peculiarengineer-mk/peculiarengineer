<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
  <defs>
    <radialGradient id="glow" cx="30%" cy="32%" r="82%">
      <stop offset="0%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#251e18" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1360" height="680" fill="url(#glow)"/>
  <rect width="1360" height="680" fill="url(#grid)" opacity="0.5"/>

  <!-- ghost folder bottom right -->
  <g opacity="0.5" stroke="#3a2f24" stroke-width="6" fill="none" stroke-linejoin="round">
    <path d="M1150 560 h34 l12 -14 h48 v70 h-94 z"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="928" y="48" width="384" height="46" rx="8" fill="none" stroke="#9a8a76" stroke-width="1.5"/>
    <text x="952" y="77" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" letter-spacing="2" fill="#e8a33d">&#9670; UBUNTU 26.04 &#183; PERMISSIONS</text>
  </g>

  <!-- terminal -->
  <g>
    <rect x="72" y="120" width="672" height="462" rx="11" fill="#0e0b09" stroke="#9a8a76" stroke-width="1.5"/>
    <line x1="72" y1="178" x2="744" y2="178" stroke="#251e18" stroke-width="1.5"/>
    <circle cx="104" cy="149" r="7" fill="#9a8a76"/>
    <circle cx="128" cy="149" r="7" fill="#9a8a76"/>
    <circle cx="152" cy="149" r="7" fill="#9a8a76"/>
    <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#9a8a76">who owns this file, and why</text>

    <text x="104" y="216" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> docker run -v /srv/app:/data img</text>
    <text x="104" y="244" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> ls -ln /srv/app</text>
    <text x="104" y="268" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#9a8a76">-rw-r--r-- 1 <tspan fill="#f2837a">5555 5555</tspan> from-app</text>
    <text x="104" y="298" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="13" fill="#f2837a"># a user that isn't on the host</text>

    <text x="104" y="352" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> chmod -R 644 tree/</text>
    <text x="104" y="376" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#9a8a76"><tspan fill="#f2837a">drw-r--r--</tspan> tree   # lost the x</text>

    <text x="104" y="428" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> setfacl -m u:5555:rwx /srv/app</text>
    <text x="104" y="452" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#4fbf87">-rw-rw----+ dave 5555   # both in</text>

    <text x="104" y="536" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#9a8a76">deleting is a directory right.<tspan fill="#e8a33d">&#9608;</tspan></text>
  </g>

  <!-- right column: the model -->
  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace">
    <text x="852" y="196" font-size="20" letter-spacing="2" fill="#9a8a76">THE PART GUIDES SKIP</text>
    <rect x="852" y="216" width="456" height="110" rx="8" fill="none" stroke="#9a8a76" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="876" y="248" font-size="14" fill="#f5c56b">x on a dir = may enter it</text>
    <text x="876" y="274" font-size="14" fill="#f5c56b">write on a dir = may delete in it</text>
    <text x="876" y="300" font-size="14" fill="#9a8a76">not the file. the directory.</text>

    <text x="852" y="372" font-size="20" letter-spacing="2" fill="#9a8a76">SHARED DIRECTORY</text>
    <rect x="852" y="392" width="456" height="72" rx="8" fill="none" stroke="#4fbf87" stroke-width="2"/>
    <text x="876" y="424" font-size="13" fill="#4fbf87">chmod 2775 + setfacl -d</text>
    <text x="876" y="446" font-size="13" fill="#9a8a76">setgid for the group, ACL for the mode</text>

    <text x="852" y="508" font-size="20" letter-spacing="2" fill="#9a8a76">uutils chmod</text>
    <rect x="852" y="528" width="456" height="58" rx="8" fill="none" stroke="#9a8a76" stroke-width="2"/>
    <text x="876" y="560" font-size="13" fill="#f5c56b">invalid digit found in string</text>
    <text x="876" y="578" font-size="12" fill="#9a8a76">Rust error text, same behavior</text>
  </g>
</svg>