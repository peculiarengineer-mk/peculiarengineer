<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
  <defs>
    <radialGradient id="glow" cx="30%" cy="34%" r="82%">
      <stop offset="0%" stop-color="#150e14"/>
      <stop offset="100%" stop-color="#08060a"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e1420" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1360" height="680" fill="url(#glow)"/>
  <rect width="1360" height="680" fill="url(#grid)" opacity="0.5"/>

  <!-- ghost 24 -> 26 arrow, bottom right -->
  <g opacity="0.5" stroke="#3a2233" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1168 640 H1268"/>
    <path d="M1240 614 L1268 640 L1240 666"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="1006" y="48" width="306" height="46" rx="8" fill="none" stroke="#8d7089" stroke-width="1.5"/>
    <text x="1030" y="77" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" letter-spacing="2" fill="#d9743f">&#9670; 24.04 &#8594; 26.04 LTS</text>
  </g>

  <!-- terminal -->
  <g>
    <rect x="72" y="120" width="672" height="462" rx="11" fill="#0e0a0e" stroke="#8d7089" stroke-width="1.5"/>
    <line x1="72" y1="178" x2="744" y2="178" stroke="#1e1420" stroke-width="1.5"/>
    <circle cx="104" cy="149" r="7" fill="#8d7089"/>
    <circle cx="128" cy="149" r="7" fill="#8d7089"/>
    <circle cx="152" cy="149" r="7" fill="#8d7089"/>
    <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#8d7089">noble &#8594; resolute</text>

    <text x="104" y="222" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#d9743f"><tspan fill="#f0a06a">$</tspan> do-release-upgrade -c</text>
    <text x="104" y="248" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#8d7089">Checking for a new Ubuntu release</text>
    <text x="104" y="272" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#f2837a">There is no development version of an LTS</text>
    <text x="104" y="296" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#f2837a">available.</text>

    <text x="104" y="356" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#d9743f"><tspan fill="#f0a06a">$</tspan> grep Supported meta-release-lts</text>
    <text x="104" y="382" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#8d7089">Dist: resolute</text>
    <text x="104" y="406" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#f2837a">Supported: 0<tspan fill="#8d7089">&#160;&#160;&#160;&#160;&#8592; that is the whole answer</tspan></text>

    <text x="104" y="466" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#d9743f"><tspan fill="#f0a06a">$</tspan> do-release-upgrade -d</text>
    <text x="104" y="492" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#f2837a">You have not rebooted after updating a</text>
    <text x="104" y="516" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#f2837a">package which requires a reboot.<tspan fill="#d9743f">&#9608;</tspan></text>

    <text x="104" y="560" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#8d7089">the path opens 27 August.</text>
  </g>

  <!-- right column -->
  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace">
    <text x="852" y="196" font-size="20" letter-spacing="2" fill="#8d7089">YOUR REPOS, DISABLED</text>

    <rect x="852" y="216" width="456" height="96" rx="8" fill="none" stroke="#f2837a" stroke-width="2"/>
    <text x="876" y="248" font-size="15" fill="#f2837a">docker.sources</text>
    <text x="876" y="274" font-size="15" fill="#f2837a">Enabled: no</text>
    <text x="876" y="300" font-size="14" fill="#8d7089">was disabled (unknown mirror)</text>

    <text x="852" y="360" font-size="20" letter-spacing="2" fill="#8d7089">THE SPLIT USERLAND</text>

    <rect x="852" y="380" width="456" height="120" rx="8" fill="none" stroke="#8d7089" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="876" y="412" font-size="15" fill="#f0a06a">ls, sort, cat  &#8594; uutils (Rust)</text>
    <text x="876" y="438" font-size="15" fill="#4fbf87">cp, mv, rm     &#8594; GNU (reverted)</text>
    <text x="876" y="466" font-size="14" fill="#8d7089">one PATH, two implementations</text>
    <text x="876" y="490" font-size="14" fill="#8d7089">coreutils-from-gnu to go back</text>

    <text x="852" y="548" font-size="20" letter-spacing="2" fill="#8d7089">AND initramfs-tools &#8594; dracut</text>
    <text x="852" y="578" font-size="16" fill="#8d7089">tested on a box I could throw away</text>
  </g>
</svg>