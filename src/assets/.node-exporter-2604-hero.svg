  <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#a08a7e">host metrics, private network</text>
  <text x="104" y="216" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14.5" fill="#f28c38"><tspan fill="#f7b27a">$</tspan> sudo apt install --no-install-recommends prometheus-node-exporter</text>
  <text x="104" y="246" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14.5" fill="#a08a7e">1 package. with recommends: 22.</text>
  <text x="104" y="276" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14.5" fill="#f28c38"><tspan fill="#f7b27a">$</tspan> curl -s http://10.20.1.10:9100/metrics | grep -E "^(apt_|node_reboot)"</text>
  <text x="104" y="306" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14.5" fill="#f0c060">apt_upgrades_pending{...security...} 70</text>
