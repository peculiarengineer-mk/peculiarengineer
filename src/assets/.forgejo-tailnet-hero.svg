<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
  <defs>
    <radialGradient id="glow" cx="30%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#11151d"/>
      <stop offset="100%" stop-color="#0b0d12"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#12161f" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1360" height="680" fill="url(#glow)"/>
  <rect width="1360" height="680" fill="url(#grid)" opacity="0.5"/>

  <!-- ghost shared namespace, bottom right: two containers, one network stack -->
  <g opacity="0.5">
    <rect x="1186" y="578" width="134" height="86" rx="10" fill="none" stroke="#182236" stroke-width="4"/>
    <rect x="1204" y="594" width="98" height="24" rx="5" fill="none" stroke="#182236" stroke-width="2"/>
    <rect x="1204" y="626" width="98" height="24" rx="5" fill="none" stroke="#182236" stroke-width="2"/>
    <path d="M1253 618 L1253 626" stroke="#182236" stroke-width="3" fill="none"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="1040" y="48" width="272" height="46" rx="8" fill="none" stroke="#3d5273" stroke-width="1.5"/>
    <text x="1066" y="77" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" letter-spacing="2" fill="#f0883e">&#9670; FORGEJO &#183; TAILNET</text>
  </g>

  <!-- terminal -->
  <g>
    <rect x="72" y="120" width="672" height="462" rx="11" fill="#0e121a" stroke="#3d5273" stroke-width="1.5"/>
    <line x1="72" y1="178" x2="744" y2="178" stroke="#12161f" stroke-width="1.5"/>
    <circle cx="104" cy="149" r="7" fill="#3d5273"/>
    <circle cx="128" cy="149" r="7" fill="#3d5273"/>
    <circle cx="152" cy="149" r="7" fill="#3d5273"/>
    <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#3d5273">your own git host &#183; no open ports</text>

    <text x="104" y="220" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#f0883e"><tspan fill="#ffb37a">$</tspan> docker compose up -d</text>
    <text x="104" y="248" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#6fd08a"><tspan fill="#6fd08a">&#10003;</tspan> ts-forgejo  started</text>
    <text x="104" y="274" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#6fd08a"><tspan fill="#6fd08a">&#10003;</tspan> forgejo     started</text>

    <text x="104" y="330" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#3d5273">  # network_mode: service:ts-forgejo</text>

    <text x="104" y="380" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#f0883e"><tspan fill="#ffb37a">$</tspan> curl -I https://forgejo.tail1234.ts.net/</text>
    <text x="104" y="408" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#5a7bf0">HTTP/2 200</text>

    <text x="104" y="464" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#f0883e"><tspan fill="#ffb37a">$</tspan> git clone git@forgejo.tail1234.ts.net:me/repo.git</text>
    <text x="104" y="492" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#6fd08a"><tspan fill="#6fd08a">&#10003;</tspan> cloning over port 22</text>

    <text x="104" y="554" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" fill="#3d5273">no DNS record, no certbot, nothing exposed</text>
  </g>

  <!-- right: what you get -->
  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace">
    <text x="852" y="200" font-size="20" letter-spacing="2" fill="#3d5273">WHAT YOU GET</text>

    <rect x="852" y="220" width="456" height="64" rx="8" fill="none" stroke="#5a7bf0" stroke-width="2"/>
    <text x="876" y="259" font-size="19" fill="#ffb37a">forgejo <tspan fill="#5a7bf0">is</tspan> the tailscale node</text>

    <text x="1080" y="312" font-size="22" fill="#3d5273" text-anchor="middle">&#8595;</text>

    <rect x="852" y="328" width="456" height="64" rx="8" fill="none" stroke="#3d5273" stroke-width="2"/>
    <text x="876" y="367" font-size="19" fill="#ffb37a">real cert, no port 80 opened</text>

    <text x="1080" y="420" font-size="22" fill="#3d5273" text-anchor="middle">&#8595;</text>

    <rect x="852" y="436" width="456" height="64" rx="8" fill="none" stroke="#6fd08a" stroke-width="2"/>
    <text x="876" y="475" font-size="19" fill="#6fd08a"><tspan fill="#6fd08a">&#10003;</tspan> reachable from your tailnet only</text>

    <text x="852" y="546" font-size="18" fill="#3d5273">sidecar &#183; serve &#183; clone &#183; keep the state</text>
  </g>
</svg>