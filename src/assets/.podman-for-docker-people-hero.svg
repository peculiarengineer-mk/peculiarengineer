<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
  <defs><radialGradient id="g" cx="30%" cy="32%" r="82%"><stop offset="0%" stop-color="#171310"/><stop offset="100%" stop-color="#0a0807"/></radialGradient>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#251e18" stroke-width="1"/></pattern></defs>
  <rect width="1360" height="680" fill="url(#g)"/><rect width="1360" height="680" fill="url(#grid)" opacity="0.5"/>
  <g opacity="0.45" stroke="#3a2f24" stroke-width="6" fill="none"><rect x="1150" y="540" width="100" height="70" rx="6"/><path d="M1150 575h100M1183 540v35M1217 575v35"/></g>
  <g><rect x="771.6" y="48" width="540.4" height="46" rx="8" fill="none" stroke="#9a8a76" stroke-width="1.5"/>
  <text x="795.6" y="77" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" letter-spacing="2" fill="#e8a33d">&#9670; ROCKY 10 · PODMAN FOR DOCKER PEOPLE</text></g>
  <g><rect x="72" y="120" width="700" height="462" rx="11" fill="#0e0b09" stroke="#9a8a76" stroke-width="1.5"/>
  <line x1="72" y1="178" x2="772" y2="178" stroke="#251e18" stroke-width="1.5"/>
  <circle cx="104" cy="149" r="7" fill="#9a8a76"/><circle cx="128" cy="149" r="7" fill="#9a8a76"/><circle cx="152" cy="149" r="7" fill="#9a8a76"/>
  <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#9a8a76">same commands, new traps</text>
  <text x="104" y="216" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> podman pull traefik/whoami</text>
  <text x="104" y="242" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#f2837a">Error: short-name resolution enforced</text>
  <text x="104" y="268" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> curl &lt;box&gt;:8080   # firewalld says closed</text>
  <text x="104" y="294" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#f2837a">200 OK</text>
  <text x="104" y="320" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> curl 127.0.0.1:8082   # bind mount</text>
  <text x="104" y="346" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#f2837a">403 Forbidden</text>
  <text x="104" y="372" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> systemctl --user enable site.service</text>
  <text x="104" y="398" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#f2837a">Unit ... is transient or generated</text>
  <text x="104" y="424" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> loginctl enable-linger keith</text>
  <text x="104" y="450" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#4fbf87">Linger=yes</text>
  <text x="104" y="476" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#9a8a76"></text>
  <text x="104" y="502" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#4fbf87">no daemon. systemd is the daemon.</text>
  <text x="104" y="548" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#9a8a76">full names, :Z, linger.<tspan fill="#e8a33d">&#9608;</tspan></text></g>
  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace"><text x="852" y="200" font-size="20" letter-spacing="2" fill="#9a8a76">DOCKER HABIT, PODMAN FORM</text>
  <text x="1000" y="232" font-size="13" fill="#9a8a76">docker</text><text x="1130" y="232" font-size="13" fill="#9a8a76">podman</text>
  <line x1="852" y1="274" x2="1300" y2="274" stroke="#251e18"/><text x="852" y="262" font-size="14" fill="#9a8a76">install</text><text x="1000" y="262" font-size="13" fill="#e8a33d">docker-ce</text><text x="1130" y="262" font-size="13" fill="#4fbf87">podman</text>
  <line x1="852" y1="318" x2="1300" y2="318" stroke="#251e18"/><text x="852" y="306" font-size="14" fill="#9a8a76">image</text><text x="1000" y="306" font-size="13" fill="#e8a33d">nginx</text><text x="1130" y="306" font-size="13" fill="#4fbf87">full name</text>
  <line x1="852" y1="362" x2="1300" y2="362" stroke="#251e18"/><text x="852" y="350" font-size="14" fill="#9a8a76">daemon</text><text x="1000" y="350" font-size="13" fill="#e8a33d">dockerd</text><text x="1130" y="350" font-size="13" fill="#4fbf87">none, systemd</text>
  <line x1="852" y1="406" x2="1300" y2="406" stroke="#251e18"/><text x="852" y="394" font-size="14" fill="#9a8a76">restart</text><text x="1000" y="394" font-size="13" fill="#e8a33d">--restart</text><text x="1130" y="394" font-size="13" fill="#4fbf87">Quadlet unit</text>
  <line x1="852" y1="450" x2="1300" y2="450" stroke="#251e18"/><text x="852" y="438" font-size="14" fill="#9a8a76">mount</text><text x="1000" y="438" font-size="13" fill="#e8a33d">-v /data:/data</text><text x="1130" y="438" font-size="13" fill="#4fbf87">-v /data:/data:Z</text>
  <line x1="852" y1="494" x2="1300" y2="494" stroke="#251e18"/><text x="852" y="482" font-size="14" fill="#9a8a76">compose</text><text x="1000" y="482" font-size="13" fill="#e8a33d">docker compose</text><text x="1130" y="482" font-size="13" fill="#4fbf87">podman compose</text>
  <text x="852" y="534" font-size="13" fill="#f5c56b">rootful ports skip firewalld. rootless don't.</text></g>
</svg>