<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
  <defs>
    <radialGradient id="glow" cx="28%" cy="32%" r="82%">
      <stop offset="0%" stop-color="#15101d"/><stop offset="100%" stop-color="#08060c"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1e1729" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1360" height="680" fill="url(#glow)"/>
  <rect width="1360" height="680" fill="url(#grid)" opacity="0.5"/>

  <!-- ghost stacked snapshots, bottom right -->
  <g opacity="0.5" stroke="#33244a" stroke-width="6" fill="none">
    <rect x="1174" y="600" width="120" height="24" rx="5"/>
    <rect x="1186" y="632" width="120" height="24" rx="5"/>
    <rect x="1198" y="664" width="120" height="24" rx="5"/>
  </g>

  <g>
    <rect x="1016" y="48" width="296" height="46" rx="8" fill="none" stroke="#8b7aa3" stroke-width="1.5"/>
    <text x="1040" y="77" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" letter-spacing="2" fill="#a97fe0">&#9670; RESTIC &#183; RESTORE</text>
  </g>

  <g>
    <rect x="72" y="120" width="672" height="462" rx="11" fill="#0d0a13" stroke="#8b7aa3" stroke-width="1.5"/>
    <line x1="72" y1="178" x2="744" y2="178" stroke="#1e1729" stroke-width="1.5"/>
    <circle cx="104" cy="149" r="7" fill="#8b7aa3"/><circle cx="128" cy="149" r="7" fill="#8b7aa3"/><circle cx="152" cy="149" r="7" fill="#8b7aa3"/>
    <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#8b7aa3">10 restores of a live database</text>

    <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14">
      <text x="104" y="214" fill="#8b7aa3">run</text><text x="188" y="214" fill="#8b7aa3">wal</text><text x="352" y="214" fill="#8b7aa3">journal</text>
      <text x="104" y="240" fill="#c5a6f0">3</text><text x="188" y="240" fill="#f2837a">malformed</text><text x="352" y="240" fill="#f2837a">malformed</text>
      <text x="104" y="264" fill="#c5a6f0">7</text><text x="188" y="264" fill="#4fbf87">ok</text><text x="352" y="264" fill="#4fbf87">ok</text>
      <text x="104" y="288" fill="#c5a6f0">9</text><text x="188" y="288" fill="#f2837a">malformed</text><text x="352" y="288" fill="#4fbf87">ok</text>
      <text x="104" y="312" fill="#c5a6f0">10</text><text x="188" y="312" fill="#f2837a">malformed</text><text x="352" y="312" fill="#f2837a">malformed</text>
    </g>
    <text x="104" y="348" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="16" fill="#f2837a">FAILURES: 12 / 20</text>

    <text x="104" y="406" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#8b7aa3">the first one passed.</text>
    <text x="104" y="432" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#8b7aa3">that is how you end up</text>
    <text x="104" y="458" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#8b7aa3">trusting it for two years.<tspan fill="#a97fe0">&#9608;</tspan></text>

    <text x="104" y="520" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#c5a6f0">a backup nobody has restored</text>
    <text x="104" y="548" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#c5a6f0">is a rumour.</text>
  </g>

  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace">
    <text x="852" y="196" font-size="20" letter-spacing="2" fill="#8b7aa3">DUMP IT, DO NOT COPY IT</text>
    <rect x="852" y="216" width="456" height="106" rx="8" fill="none" stroke="#f2837a" stroke-width="2"/>
    <text x="876" y="248" font-size="14" fill="#f2837a">.backup  &#8594; database is locked</text>
    <text x="876" y="272" font-size="14" fill="#f2837a">         &#8594; 0 byte file</text>
    <text x="876" y="300" font-size="14" fill="#4fbf87">VACUUM INTO &#8594; 0.41s, ok</text>

    <text x="852" y="376" font-size="20" letter-spacing="2" fill="#8b7aa3">FORGET FREES NOTHING</text>
    <rect x="852" y="396" width="456" height="106" rx="8" fill="none" stroke="#8b7aa3" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="876" y="428" font-size="14" fill="#8b7aa3">16 snapshots        98 MiB</text>
    <text x="876" y="452" font-size="14" fill="#8b7aa3">forget &#8594; 3         98 MiB</text>
    <text x="876" y="478" font-size="14" fill="#c5a6f0">prune  &#8594; 3         26 MiB</text>

    <text x="852" y="546" font-size="17" fill="#8b7aa3">the password is the backup.</text>
    <text x="852" y="572" font-size="17" fill="#8b7aa3">lose it and it is just noise.</text>
  </g>
</svg>