<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
  <defs>
    <radialGradient id="glow" cx="28%" cy="32%" r="82%">
      <stop offset="0%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#251e18" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1360" height="680" fill="url(#glow)"/>
  <rect width="1360" height="680" fill="url(#grid)" opacity="0.5"/>

  <!-- ghost clock, bottom right -->
  <g opacity="0.5" stroke="#3a2f24" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="1190" cy="600" r="48"/>
    <path d="M1190 600 V566 M1190 600 H1216"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="948" y="48" width="364" height="46" rx="8" fill="none" stroke="#9a8a76" stroke-width="1.5"/>
    <text x="972" y="77" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" letter-spacing="2" fill="#e8a33d">&#9670; UBUNTU 26.04 &#183; SYSTEMD</text>
  </g>

  <!-- terminal -->
  <g>
    <rect x="72" y="120" width="672" height="462" rx="11" fill="#0e0b09" stroke="#9a8a76" stroke-width="1.5"/>
    <line x1="72" y1="178" x2="744" y2="178" stroke="#251e18" stroke-width="1.5"/>
    <circle cx="104" cy="149" r="7" fill="#9a8a76"/>
    <circle cx="128" cy="149" r="7" fill="#9a8a76"/>
    <circle cx="152" cy="149" r="7" fill="#9a8a76"/>
    <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#9a8a76">units and timers, from scratch</text>

    <text x="104" y="216" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#9a8a76"># backup.timer</text>
    <text x="104" y="240" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#f5c56b">[Timer]</text>
    <text x="104" y="264" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#e8a33d">OnCalendar=<tspan fill="#f5c56b">*-*-* 03:30:00</tspan></text>
    <text x="104" y="288" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#e8a33d">Persistent=<tspan fill="#4fbf87">true</tspan></text>
    <text x="104" y="312" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#e8a33d">AccuracySec=<tspan fill="#f5c56b">1s</tspan></text>

    <text x="104" y="362" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> systemctl list-timers backup.timer</text>
    <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14">
      <text x="104" y="392" fill="#9a8a76">NEXT</text><text x="330" y="392" fill="#9a8a76">LEFT</text><text x="440" y="392" fill="#9a8a76">LAST</text>
      <text x="104" y="416" fill="#f5c56b">Fri 03:30:00 UTC</text><text x="330" y="416" fill="#f5c56b">4h 40min</text><text x="440" y="416" fill="#4fbf87">Thu 23:12:11</text>
    </g>

    <text x="104" y="466" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#f2837a">daily job ran at /tmp</text>
    <text x="104" y="490" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#9a8a76">%T is systemd's. write %%T.<tspan fill="#e8a33d">&#9608;</tspan></text>

    <text x="104" y="540" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#9a8a76">no shell. no HOME. five entry PATH.</text>
  </g>

  <!-- right column -->
  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace">
    <text x="852" y="196" font-size="20" letter-spacing="2" fill="#9a8a76">WHY IT FIRED LATE</text>
    <rect x="852" y="216" width="456" height="80" rx="8" fill="none" stroke="#9a8a76" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="876" y="248" font-size="14" fill="#f5c56b">AccuracySec defaults to 1min</text>
    <text x="876" y="274" font-size="14" fill="#9a8a76">measured: 4s to 27s after the minute</text>

    <text x="852" y="340" font-size="20" letter-spacing="2" fill="#9a8a76">THE BOX WAS OFF AT 03:30</text>
    <rect x="852" y="360" width="456" height="86" rx="8" fill="none" stroke="#4fbf87" stroke-width="2"/>
    <text x="876" y="392" font-size="14" fill="#4fbf87">Persistent=true</text>
    <text x="876" y="416" font-size="14" fill="#9a8a76">missed run happened 10s after boot</text>

    <text x="852" y="490" font-size="20" letter-spacing="2" fill="#9a8a76">ENABLE THE TIMER</text>
    <rect x="852" y="510" width="456" height="86" rx="8" fill="none" stroke="#f2837a" stroke-width="2"/>
    <text x="876" y="542" font-size="14" fill="#f5c56b">systemctl enable --now job.timer</text>
    <text x="876" y="566" font-size="14" fill="#f2837a">never the service</text>
  </g>
</svg>