<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="680" viewBox="0 0 1360 680">
  <defs>
    <radialGradient id="glow" cx="28%" cy="32%" r="82%">
      <stop offset="0%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#251e18" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1360" height="680" fill="url(#glow)"/>
  <rect width="1360" height="680" fill="url(#grid)" opacity="0.5"/>

  <!-- ghost chain, bottom right -->
  <g opacity="0.5" stroke="#3a2f24" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="1090" cy="620" r="14"/><circle cx="1170" cy="620" r="14"/><circle cx="1250" cy="620" r="14"/>
    <path d="M1104 620 H1156 M1184 620 H1236"/>
  </g>

  <!-- badge -->
  <g>
    <rect x="948" y="48" width="364" height="46" rx="8" fill="none" stroke="#9a8a76" stroke-width="1.5"/>
    <text x="972" y="77" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="18" letter-spacing="2" fill="#e8a33d">&#9670; UBUNTU 26.04 &#183; DNS</text>
  </g>

  <!-- terminal -->
  <g>
    <rect x="72" y="120" width="672" height="462" rx="11" fill="#0e0b09" stroke="#9a8a76" stroke-width="1.5"/>
    <line x1="72" y1="178" x2="744" y2="178" stroke="#251e18" stroke-width="1.5"/>
    <circle cx="104" cy="149" r="7" fill="#9a8a76"/>
    <circle cx="128" cy="149" r="7" fill="#9a8a76"/>
    <circle cx="152" cy="149" r="7" fill="#9a8a76"/>
    <text x="200" y="156" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="20" fill="#9a8a76">who is 127.0.0.53</text>

    <text x="104" y="216" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> cat /etc/resolv.conf</text>
    <text x="104" y="242" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#f5c56b">nameserver 127.0.0.53</text>

    <text x="104" y="288" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> resolvectl query example.com</text>
    <text x="104" y="314" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#9a8a76">example.com: 104.20.23.154   <tspan fill="#f5c56b">-- link: eth0</tspan></text>
    <text x="104" y="338" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#9a8a76">-- Information acquired via protocol DNS in 5.9ms.</text>
    <text x="104" y="362" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#4fbf87">-- Data from: network</text>

    <text x="104" y="408" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="15" fill="#e8a33d"><tspan fill="#f5c56b">$</tspan> resolvectl domain</text>
    <text x="104" y="434" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#9a8a76">Link 2 (eth0):  <tspan fill="#f5c56b">~.</tspan></text>
    <text x="104" y="458" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="14" fill="#9a8a76">Link 3 (corp0): <tspan fill="#f5c56b">~corp.example</tspan><tspan fill="#e8a33d">&#9608;</tspan></text>

    <text x="104" y="518" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#9a8a76">two layers. files, then dns.</text>
    <text x="104" y="546" font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace" font-size="17" fill="#9a8a76">ping asks the first. dig asks the second.</text>
  </g>

  <!-- right column -->
  <g font-family="'SF Mono','Menlo','DejaVu Sans Mono','Consolas',monospace">
    <text x="852" y="196" font-size="20" letter-spacing="2" fill="#9a8a76">TWO RESOLV.CONF FILES</text>
    <rect x="852" y="216" width="456" height="80" rx="8" fill="none" stroke="#9a8a76" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="876" y="248" font-size="14" fill="#f5c56b">stub-resolv.conf  -&gt; 127.0.0.53</text>
    <text x="876" y="274" font-size="14" fill="#9a8a76">resolv.conf       -&gt; the real upstreams</text>

    <text x="852" y="340" font-size="20" letter-spacing="2" fill="#9a8a76">WHAT SURVIVES A REBOOT</text>
    <rect x="852" y="360" width="456" height="86" rx="8" fill="none" stroke="#4fbf87" stroke-width="2"/>
    <text x="876" y="392" font-size="14" fill="#4fbf87">netplan nameservers: yes</text>
    <text x="876" y="416" font-size="14" fill="#f2837a">resolvectl dns eth0 ...: no</text>

    <text x="852" y="490" font-size="20" letter-spacing="2" fill="#9a8a76">THE OUTAGE SETTING</text>
    <rect x="852" y="510" width="456" height="86" rx="8" fill="none" stroke="#f2837a" stroke-width="2"/>
    <text x="876" y="542" font-size="14" fill="#f2837a">DNSOverTLS=yes with DHCP servers</text>
    <text x="876" y="566" font-size="14" fill="#9a8a76">no answer for 20s. set DNS= too.</text>
  </g>
</svg>